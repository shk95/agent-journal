name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public:
    uses: ./.github/workflows/checks.yml

  packages:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
      - run: nix flake check

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [public, packages]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Create the server release manifest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/master
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          import tomllib
          with open("pyproject.toml", "rb") as source:
              version = tomllib.load(source)["project"]["version"]
          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", tag) or tag != "v" + version:
              raise SystemExit("The tag must match the version in pyproject.toml")
          commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          with open("server-release.json", "w") as output:
              json.dump({"tag": tag, "commit": commit}, output)
          PY
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" server-release.json --verify-tag --title "$RELEASE_TAG" --generate-notes
