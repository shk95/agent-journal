[project]
name = "agent-journal"
version = "0.4.0"
description = "A personal journal for Codex sessions across GitHub projects"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2,<3",
    "websockets>=15,<17",
]

[project.scripts]
agent-journal = "agent_journal.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
bundle = [
    "pyinstaller>=6,<7",
]
