[project]
name = "agent-journal"
version = "0.6.0"
description = "A personal journal for Codex sessions across GitHub projects"
requires-python = ">=3.11"
dependencies = [
    "markdown-it-py>=3,<5",
    "mcp>=2,<3",
    "wcwidth>=0.9,<1",
    "websockets>=15,<17",
]

[project.scripts]
agent-journal = "agent_journal.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
bundle = [
    "pyinstaller>=6,<7",
]

[[tool.agent-journal.upgrade-from]]
minimum = "v0.1.0"
maximum = "v0.5.0"
